# Installateur Windows de la coquille native (infra/windows-app, Tauri).
# Compilé sur un runner Windows : rien à installer sur le PC.
name: Windows app

on:
  push:
    branches: [main]
    paths: ["infra/windows-app/**", "public/icons/icon-512.png", ".github/workflows/windows-app.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: infra/windows-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: infra/windows-app/src-tauri
      - run: npm install
      - run: npm run icon
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-windows
          path: |
            infra/windows-app/src-tauri/target/release/bundle/nsis/*.exe
            infra/windows-app/src-tauri/target/release/bundle/msi/*.msi
