# Coquille HTTP statique sur GitHub Pages (voir infra/http-shell/README.md).
# Prerequis (Settings du depot) :
#  - Pages -> Source : « GitHub Actions ».
#  - Pages -> Custom domain : ton sous-domaine, et « Enforce HTTPS » DECOCHE.
#  - Variables (Settings -> Secrets and variables -> Actions -> Variables) :
#      NEXT_PUBLIC_API_BASE_URL      https://<app>.vercel.app   (obligatoire)
#      PAGES_CUSTOM_DOMAIN           tv.exemple.fr               (obligatoire)
#      NEXT_PUBLIC_MEDIA_GATEWAY_URL https://…                   (optionnel)
name: Pages (coquille HTTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:static
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_MEDIA_GATEWAY_URL: ${{ vars.NEXT_PUBLIC_MEDIA_GATEWAY_URL }}
          PAGES_CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
