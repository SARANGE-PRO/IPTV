# Coquille HTTP statique sur GitHub Pages (voir infra/http-shell/README.md).
#
# Deploiement par BRANCHE `gh-pages` (et non par l'artefact « GitHub Actions ») :
# aucun reglage n'est necessaire dans Settings → Pages, GitHub publie la branche
# et lit le fichier CNAME qu'elle contient (domaine HTTP). Les valeurs non
# secretes (origine de l'API Vercel, domaine) sont versionnees dans
# infra/http-shell/pages.env — pas de « Variables » de depot a configurer.
#
# `verify` (typecheck, lint, tests) bloque le deploiement : une regression ne
# part jamais sur le telephone. Sur une pull request, seul `verify` tourne.
name: Pages (coquille HTTP)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # tsc couvre aussi src/app/api, que le build statique met de cote.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build-deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build statique (variables lues dans infra/http-shell/pages.env)
        run: |
          set -a
          . infra/http-shell/pages.env
          set +a
          npm run build:static
      - name: Publier out/ sur la branche gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
          commit_message: 'deploy: coquille HTTP statique'
