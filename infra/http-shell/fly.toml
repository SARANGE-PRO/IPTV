# Coquille HTTP pure sur Fly.io. Deployer depuis la RACINE du depot :
#   fly launch --no-deploy --copy-config -c infra/http-shell/fly.toml
#   fly secrets set TMDB_API_KEY=... FOOTBALL_API_KEY=... -c infra/http-shell/fly.toml
#   fly deploy -c infra/http-shell/fly.toml
#
# UNIQUEMENT le port 80 en clair : aucun handler TLS, donc aucune redirection
# vers HTTPS, et une tentative HTTPS du navigateur echoue vite -> il retombe en
# HTTP. (Ne PAS ajouter de bloc 443 : il reintroduirait le mixed-content.)
app = "zibtv-http"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"

[[services]]
  protocol = "tcp"
  internal_port = 3000
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = false

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
